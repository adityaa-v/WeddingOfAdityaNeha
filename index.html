<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aditya & Neha | Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ivory: #f8f4ec;
            --card: #fffdf8;
            --ink: #362419;
            --ink-soft: #6b584a;
            --maroon: #7a0016;
            --gold: #b8863b;
            --gold-deep: #8f6423;
            --gold-tint: #e9d9ad;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--ivory);
            font-family: 'Montserrat', sans-serif;
            color: var(--ink);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* =========================================
           HERO / ENVELOPE
           ========================================= */
        #hero-scene {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            z-index: 10;
            background:
                radial-gradient(circle at 20% 20%, rgba(184,134,59,0.06), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(122,0,22,0.05), transparent 45%),
                var(--ivory);
        }

        .envelope-wrapper {
            position: relative;
            width: 340px;
            height: 230px;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 18px 28px rgba(54,36,25,0.18));
        }

        .envelope-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #8f6423 0%, #b8863b 100%);
            border-radius: 2px;
        }

        .envelope-front {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #c9a24d 0%, #e3c07a 55%, #b8863b 100%);
            clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
            border-radius: 2px;
            z-index: 3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
        }

        .envelope-flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #d8b567 0%, #b8863b 100%);
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.4s;
            z-index: 4;
            border-radius: 2px;
        }

        .wax-seal {
            position: absolute;
            left: 50%; top: 52%;
            transform: translate(-50%, -50%);
            width: 62px; height: 62px;
            background: radial-gradient(circle, #7a0016 0%, #4a000d 100%);
            border-radius: 50%;
            z-index: 5;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 0 5px rgba(255,255,255,0.15);
            display: flex; justify-content: center; align-items: center;
            color: var(--gold-tint); font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 600; letter-spacing: 1px;
            transition: transform 0.3s, opacity 0.3s;
        }
        .wax-seal:hover { transform: translate(-50%, -50%) scale(1.08); }

        .invite-card-preview {
            position: absolute;
            top: 8px; left: 12px; right: 12px; bottom: 8px;
            background: var(--card);
            border-radius: 2px;
            z-index: 2;
            border: 1px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .preview-ganesha { color: var(--maroon); font-size: 0.8rem; margin-bottom: 8px; }
        .preview-names {
            font-family: 'Cormorant Garamond', serif;
            font-variant: small-caps;
            letter-spacing: 2px;
            font-size: 1.5rem;
            color: var(--ink);
            line-height: 1.3;
            text-align: center;
        }

        .envelope-wrapper.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .wax-seal { opacity: 0; pointer-events: none; }
        .envelope-wrapper.open .invite-card-preview {
            opacity: 1;
            transform: translateY(-120px);
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1) 0.5s, opacity 0.3s 0.3s;
        }

        .scroll-prompt {
            position: absolute;
            bottom: 48px;
            text-align: center;
            width: 100%;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 3px;
            color: var(--gold-deep);
            opacity: 0;
            transition: opacity 1s 1.5s;
            animation: bounce 2.2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* =========================================
           MAIN CARD
           ========================================= */
        #app-container {
            display: none;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            background:
                radial-gradient(circle at 15% 10%, rgba(184,134,59,0.05), transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(122,0,22,0.04), transparent 40%),
                var(--ivory);
            min-height: 100vh;
            padding: 36px 18px 60px;
            box-sizing: border-box;
        }

        .frame-outer {
            position: relative;
            padding: 34px;
        }

        .app-inner {
            position: relative;
            background: var(--card);
            border: 1px solid var(--gold);
            padding: 56px 34px 44px;
            text-align: center;
        }
        /* inner hairline rule, set slightly inside the border for the classic double-line look */
        .app-inner::after {
            content: "";
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid var(--gold);
            pointer-events: none;
        }

        .corner-ornament {
            position: absolute;
            width: 86px; height: 86px;
            color: var(--gold);
            z-index: 2;
        }
        .corner-tl { top: -6px; left: -6px; }
        .corner-tr { top: -6px; right: -6px; transform: scaleX(-1); }
        .corner-bl { bottom: -6px; left: -6px; transform: scaleY(-1); }
        .corner-br { bottom: -6px; right: -6px; transform: scale(-1,-1); }

        .medallion {
            width: 46px; height: 46px;
            color: var(--gold);
            margin: 0 auto;
        }
        .medallion.top { margin-bottom: 18px; }
        .medallion.bottom { margin-top: 26px; transform: rotate(180deg); }

        .ganesha-mark { color: var(--maroon); font-size: 0.78rem; letter-spacing: 1px; margin-bottom: 18px; }

        .pre-title {
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
            color: var(--maroon);
        }

        h1.couple-name {
            font-family: 'Cormorant Garamond', serif;
            font-variant: small-caps;
            font-weight: 600;
            font-size: 3rem;
            letter-spacing: 3px;
            margin: 2px 0;
            color: var(--ink);
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.6rem;
            color: var(--gold-deep);
            margin: 2px 0;
            display: block;
        }

        .divider {
            width: 54px; height: 1px;
            background: var(--gold);
            margin: 30px auto;
        }

        /* =========================================
           RSVP INTERFACE
           ========================================= */
        .event-block { margin: 34px 0; }

        .event-title {
            font-family: 'Cormorant Garamond', serif;
            font-variant: small-caps;
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--maroon);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .event-details {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            letter-spacing: 0.5px;
            color: var(--ink-soft);
            margin-bottom: 18px;
            line-height: 1.7;
        }
        .event-details .label {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-deep);
            display: block;
            margin-top: 12px;
        }

        .btn-group { display: flex; gap: 12px; justify-content: center; }

        .btn-rsvp {
            flex: 1;
            padding: 12px 8px;
            background: transparent;
            border: 1px solid var(--ink);
            color: var(--ink);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-rsvp.selected {
            background: var(--maroon);
            border-color: var(--maroon);
            color: #fff;
        }

        .passcode-box {
            background: transparent;
            padding: 6px 0 0;
            margin: 8px 0 0;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--gold-tint);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 14px;
            background: #fff;
            color: var(--ink);
            letter-spacing: 1px;
        }
        textarea { text-align: left; }
        input[type="text"]:focus, textarea:focus { border-color: var(--gold-deep); outline: none; }

        .btn-primary {
            width: 100%;
            background: var(--maroon);
            color: #fff;
            padding: 15px;
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover { background: #5a0010; }

        #status-msg, #auth-error { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body>

<!-- reusable ornament artwork, referenced everywhere below via <use> -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ornament-corner" viewBox="0 0 100 100">
      <path d="M4,4 C 30,4 22,34 46,28 C 66,23 58,52 82,48" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M4,4 C 4,30 34,22 28,46 C 23,66 52,58 48,82" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="46" cy="28" r="3.2" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="28" cy="46" r="3.2" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M78,44 C 84,40 90,44 88,50 C 86,56 78,54 78,44 Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M44,78 C 40,84 44,90 50,88 C 56,86 54,78 44,78 Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M4,4 L14,4 M4,4 L4,14" stroke="currentColor" stroke-width="1.3"/>
    </symbol>
    <symbol id="ornament-medallion" viewBox="0 0 60 60">
      <g fill="none" stroke="currentColor" stroke-width="1.1">
        <ellipse cx="30" cy="18" rx="6" ry="12"/>
        <ellipse cx="30" cy="18" rx="6" ry="12" transform="rotate(45 30 18)"/>
        <ellipse cx="30" cy="18" rx="6" ry="12" transform="rotate(90 30 18)"/>
        <ellipse cx="30" cy="18" rx="6" ry="12" transform="rotate(135 30 18)"/>
        <circle cx="30" cy="18" r="3.4"/>
      </g>
      <path d="M30,30 C 22,34 22,44 30,50 C 38,44 38,34 30,30 Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
    </symbol>
  </defs>
</svg>

<!-- 3D ENVELOPE HERO SCENE -->
<div id="hero-scene">
    <div class="envelope-wrapper" id="envelope">
        <div class="envelope-back"></div>
        <div class="invite-card-preview">
            <div class="preview-ganesha">॥ श्री गणेशाय नमः ॥</div>
            <div class="preview-names">Aditya &amp; Neha</div>
        </div>
        <div class="envelope-front"></div>
        <div class="envelope-flap"></div>
        <div class="wax-seal" onclick="openEnvelope()">A&amp;N</div>
    </div>
    <div class="scroll-prompt" id="scroll-prompt">Scroll to view invitation</div>
</div>

<!-- MAIN JSON-DRIVEN APPLICATION -->
<div id="app-container">
    <div class="frame-outer">
        <svg class="corner-ornament corner-tl"><use href="#ornament-corner"/></svg>
        <svg class="corner-ornament corner-tr"><use href="#ornament-corner"/></svg>
        <svg class="corner-ornament corner-bl"><use href="#ornament-corner"/></svg>
        <svg class="corner-ornament corner-br"><use href="#ornament-corner"/></svg>

        <div class="app-inner">
            <svg class="medallion top"><use href="#ornament-medallion"/></svg>

            <div class="ganesha-mark">॥ श्री गणेशाय नमः ॥</div>
            <div class="pre-title" id="ui-tagline"></div>
            <h1 class="couple-name" id="ui-name1"></h1>
            <span class="ampersand">&amp;</span>
            <h1 class="couple-name" id="ui-name2"></h1>

            <div class="divider"></div>

            <!-- AUTHENTICATION (Passcode) -->
            <div id="auth-section" class="passcode-box">
                <div class="pre-title" style="margin-bottom: 14px; color: var(--ink-soft);">Your Invitation</div>
                <input type="text" id="inviteCode" placeholder="ENTER YOUR PASSCODE" style="text-transform: uppercase;">
                <button class="btn-primary" onclick="verifyPasscode()">Unlock Details</button>
                <div id="auth-error" style="color: #990000; font-size: 0.82rem; margin-top: 14px; font-weight: 500;"></div>
            </div>

            <!-- DYNAMIC EVENTS RENDERED BY JSON -->
            <div id="events-container" style="display: none;">
                <p style="font-family: 'Cormorant Garamond', serif; font-variant: small-caps; font-size: 1.3rem; color: var(--ink); font-weight: 600; letter-spacing: 1px;" id="welcome-message"></p>
                <p style="font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--ink-soft); margin-bottom: 28px;">Please see the details of our celebration below.</p>

                <div id="dynamic-events"></div>

                <div class="divider"></div>
                <textarea id="dietary" rows="3" placeholder="Dietary requirements or special notes..."></textarea>
                <button class="btn-primary" onclick="submitRSVP()" id="submitBtn">Send RSVP</button>
                <div id="status-msg" style="margin-top: 15px; font-size: 0.9rem; font-weight: 500;"></div>
            </div>

            <svg class="medallion bottom"><use href="#ornament-medallion"/></svg>
        </div>
    </div>
</div>

<script>
    // 1. GLOBAL APP CONFIGURATION
    const AppData = {
        scriptUrl: "https://script.google.com/macros/s/AKfycbyY0A0_NZGJCfGli4bRGlHGhD1gFzI4FpVwedfzMcrR_ivo_k1eoS5x7jk3U6_mdhgo/exec",
        couple: { name1: "Aditya", name2: "Neha" },
        tagline: "joyfully invite you to celebrate the wedding of",
        events: {
            haldi: { id: "haldi", title: "Haldi & Mehndi", date: "Monday, November 16", time: "4:00 PM", venue: "Family Residence" },
            wedding: { id: "wedding", title: "Wedding Ceremony", date: "Thursday, November 18", time: "10:30 AM", venue: "The Epping Club" },
            reception: { id: "reception", title: "Wedding Reception", date: "Saturday, November 20", time: "6:00 PM", venue: "Fontana Amorosa" }
        },
        guest: null,
        rsvpState: {}
    };

    document.getElementById('ui-tagline').innerText = AppData.tagline;
    document.getElementById('ui-name1').innerText = AppData.couple.name1;
    document.getElementById('ui-name2').innerText = AppData.couple.name2;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('code')) {
        document.getElementById('inviteCode').value = urlParams.get('code');
    }

    function openEnvelope() {
        const env = document.getElementById('envelope');
        env.classList.add('open');
        document.getElementById('scroll-prompt').style.opacity = '1';
        document.getElementById('app-container').style.display = 'block';

        setTimeout(() => {
            document.getElementById('app-container').scrollIntoView({ behavior: 'smooth' });
            if (document.getElementById('inviteCode').value) {
                setTimeout(verifyPasscode, 500);
            }
        }, 1500);
    }

    function verifyPasscode() {
        const code = document.getElementById('inviteCode').value.trim();
        const err = document.getElementById('auth-error');
        err.innerText = "";

        if (!code) {
            err.innerText = "Please enter your passcode.";
            return;
        }

        err.style.color = "#666";
        err.innerText = "Locating your invitation...";

        const finalUrl = AppData.scriptUrl + "?code=" + encodeURIComponent(code);

        fetch(finalUrl, { redirect: "follow" })
            .then(response => response.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data.found) {
                        AppData.guest = data;
                        document.getElementById('auth-section').style.display = 'none';
                        document.getElementById('events-container').style.display = 'block';
                        document.getElementById('welcome-message').innerText = `To: ${data.name}`;
                        renderEvents();
                    } else {
                        err.style.color = "#990000";
                        err.innerText = data.error ? ("Error: " + data.error) : "Passcode not recognized.";
                    }
                } catch (e) {
                    err.style.color = "#990000";
                    err.innerText = "Connection error — got a non-JSON response.";
                    console.error("Non-JSON response:", text);
                }
            })
            .catch(err2 => {
                err.style.color = "#990000";
                err.innerText = "Network error. Please try again.";
                console.error("Fetch error:", err2);
            });
    }

    function renderEvents() {
        const container = document.getElementById('dynamic-events');
        container.innerHTML = "";

        const guestPermissions = [
            { allowed: AppData.guest.haldi || AppData.guest.mehndi, data: AppData.events.haldi },
            { allowed: AppData.guest.wedding, data: AppData.events.wedding },
            { allowed: AppData.guest.reception, data: AppData.events.reception }
        ];

        guestPermissions.forEach(event => {
            if (event.allowed) {
                AppData.rsvpState[event.data.id] = "N/A";

                const eventHTML = `
                    <div class="event-block">
                        <div class="event-title">${event.data.title}</div>
                        <div class="event-details">
                            ${event.data.date} &middot; ${event.data.time}
                            <span class="label">Venue</span>
                            ${event.data.venue}
                        </div>
                        <div class="btn-group">
                            <button class="btn-rsvp" id="btn-yes-${event.data.id}" onclick="setRsvp('${event.data.id}', 'Attending')">Will Attend</button>
                            <button class="btn-rsvp" id="btn-no-${event.data.id}" onclick="setRsvp('${event.data.id}', 'Declined')">Will Not Attend</button>
                        </div>
                    </div>
                `;
                container.innerHTML += eventHTML;
            }
        });
    }

    function setRsvp(eventId, status) {
        AppData.rsvpState[eventId] = status;
        document.getElementById(`btn-yes-${eventId}`).classList.remove('selected');
        document.getElementById(`btn-no-${eventId}`).classList.remove('selected');
        if (status === 'Attending') document.getElementById(`btn-yes-${eventId}`).classList.add('selected');
        if (status === 'Declined') document.getElementById(`btn-no-${eventId}`).classList.add('selected');
    }

    function submitRSVP() {
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('status-msg');

        const invitedEventIds = Object.keys(AppData.rsvpState);
        const missedEvent = invitedEventIds.find(id => AppData.rsvpState[id] === "N/A");

        if (missedEvent) {
            msg.style.color = "#990000";
            msg.innerText = "Please select 'Will Attend' or 'Will Not Attend' for all events.";
            return;
        }

        btn.innerText = "Sending...";
        btn.disabled = true;
        msg.innerText = "";

        const payload = {
            code: AppData.guest.code,
            name: AppData.guest.name,
            haldi: AppData.rsvpState.haldi || "N/A",
            wedding: AppData.rsvpState.wedding || "N/A",
            reception: AppData.rsvpState.reception || "N/A",
            dietary: document.getElementById('dietary').value
        };

        fetch(AppData.scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            msg.style.color = "green";
            msg.innerText = "Thank you! Your RSVP has been recorded.";
            btn.style.display = "none";
        })
        .catch(() => {
            msg.style.color = "#990000";
            msg.innerText = "Error sending RSVP. Please try again.";
            btn.innerText = "Send RSVP";
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
