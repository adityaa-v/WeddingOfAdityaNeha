<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aditya & Neha | Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ivory: #f8f4ec;
            --card: #fffdf8;
            --ink: #362419;
            --ink-soft: #6b584a;
            --maroon: #7a0016;
            --gold: #b8863b;
            --gold-deep: #8f6423;
            --gold-tint: #e9d9ad;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--ivory);
            font-family: 'Montserrat', sans-serif;
            color: var(--ink);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* =========================================
           HERO — simplified, reliable reveal
           (opacity/transform only, no clip-path animation)
           ========================================= */
        #hero-scene {
            position: relative;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background:
                radial-gradient(circle at 20% 20%, rgba(184,134,59,0.06), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(122,0,22,0.05), transparent 45%),
                var(--ivory);
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        #hero-scene.dismissed {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            position: absolute;
            top: 0; left: 0;
        }

        .envelope-card {
            width: 280px;
            padding: 40px 24px;
            background: var(--card);
            border: 1px solid var(--gold);
            text-align: center;
            box-shadow: 0 18px 40px rgba(54,36,25,0.14);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        .envelope-card.breaking {
            transform: scale(0.94);
            opacity: 0;
        }

        .preview-ganesha { color: var(--maroon); font-size: 0.8rem; margin-bottom: 14px; }
        .preview-names {
            font-family: 'Cormorant Garamond', serif;
            font-variant: small-caps;
            letter-spacing: 2px;
            font-size: 1.7rem;
            color: var(--ink);
            line-height: 1.35;
        }

        .wax-seal {
            width: 58px; height: 58px;
            margin: 26px auto 0;
            background: radial-gradient(circle, #7a0016 0%, #4a000d 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 0 5px rgba(255,255,255,0.15);
            display: flex; justify-content: center; align-items: center;
            color: var(--gold-tint); font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 600; letter-spacing: 1px;
            transition: transform 0.25s ease;
        }
        .wax-seal:active { transform: scale(0.9); }

        .tap-hint {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold-deep);
            margin-top: 12px;
        }

        /* =========================================
           MAIN CARD
           ========================================= */
        #app-container {
            display: none;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            background:
                radial-gradient(circle at 15% 10%, rgba(184,134,59,0.05), transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(122,0,22,0.04), transparent 40%),
                var(--ivory);
            min-height: 100vh;
            padding: 36px 18px 60px;
            box-sizing: border-box;
        }
        #app-container.visible { opacity: 1; transform: translateY(0); }

        .frame-outer {
            position: relative;
            padding: 30px;
        }

        .app-inner {
            position: relative;
            background: var(--card);
            border: 1px solid var(--gold);
            padding: 50px 32px 40px;
            text-align: center;
        }
        .app-inner::after {
            content: "";
            position: absolute;
            top: 7px; left: 7px; right: 7px; bottom: 7px;
            border: 1px solid var(--gold);
            pointer-events: none;
        }

        .corner-ornament {
            position: absolute;
            width: 42px; height: 42px;
            color: var(--gold);
            z-index: 2;
        }
        .corner-tl { top: -8px; left: -8px; }
        .corner-tr { top: -8px; right: -8px; transform: scaleX(-1); }
        .corner-bl { bottom: -8px; left: -8px; transform: scaleY(-1); }
        .corner-br { bottom: -8px; right: -8px; transform: scale(-1,-1); }

        .medallion { width: 44px; height: 44px; color: var(--gold); margin: 0 auto; }
        .medallion.top { margin-bottom: 18px; }
        .medallion.bottom { margin-top: 26px; transform: rotate(180deg); }

        .ganesha-mark { color: var(--maroon); font-size: 0.78rem; letter-spacing: 1px; margin-bottom: 18px; }

        .pre-title {
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
            color: var(--maroon);
        }

        h1.couple-name {
            font-family: 'Cormorant Garamond', serif;
            font-variant: small-caps;
            font-weight: 600;
            font-size: 3rem;
            letter-spacing: 3px;
            margin: 2px 0;
            color: var(--ink);
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.6rem;
            color: var(--gold-deep);
            margin: 2px 0;
            display: block;
        }

        .divider { width: 54px; height: 1px; background: var(--gold); margin: 30px auto; }

        /* =========================================
           RSVP INTERFACE
           ========================================= */
        .event-block { margin: 34px 0; }

        .event-title {
            font-family: 'Cormorant Garamond', serif;
            font-variant: small-caps;
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--maroon);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .event-details {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            letter-spacing: 0.5px;
            color: var(--ink-soft);
            margin-bottom: 18px;
            line-height: 1.7;
        }
        .event-details .label {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-deep);
            display: block;
            margin-top: 12px;
        }

        .btn-group { display: flex; gap: 12px; justify-content: center; }

        .btn-rsvp {
            flex: 1;
            padding: 12px 8px;
            background: transparent;
            border: 1px solid var(--ink);
            color: var(--ink);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-rsvp.selected { background: var(--maroon); border-color: var(--maroon); color: #fff; }

        .no-events-note {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--ink-soft);
            padding: 20px 10px;
            border-top: 1px solid var(--gold-tint);
            border-bottom: 1px solid var(--gold-tint);
            margin: 20px 0;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--gold-tint);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 14px;
            background: #fff;
            color: var(--ink);
            letter-spacing: 1px;
        }
        textarea { text-align: left; }
        input[type="text"]:focus, textarea:focus { border-color: var(--gold-deep); outline: none; }

        .btn-primary {
            width: 100%;
            background: var(--maroon);
            color: #fff;
            padding: 15px;
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover { background: #5a0010; }
        .btn-primary:disabled { background: #c9b6a8; cursor: not-allowed; }

        #status-msg, #auth-error { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- restrained single-curve vine, 2 leaves, 1 bud — replaces the previous tangled version -->
    <symbol id="ornament-corner" viewBox="0 0 60 60">
      <path d="M6,6 C 18,10 14,24 28,22" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      <ellipse cx="14" cy="12" rx="5" ry="2.4" transform="rotate(-25 14 12)" fill="none" stroke="currentColor" stroke-width="1"/>
      <ellipse cx="21" cy="19" rx="5" ry="2.4" transform="rotate(15 21 19)" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="29" cy="22" r="2.6" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="29" cy="22" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ornament-medallion" viewBox="0 0 60 60">
      <g fill="none" stroke="currentColor" stroke-width="1.1">
        <ellipse cx="30" cy="18" rx="6" ry="12"/>
        <ellipse cx="30" cy="18" rx="6" ry="12" transform="rotate(45 30 18)"/>
        <ellipse cx="30" cy="18" rx="6" ry="12" transform="rotate(90 30 18)"/>
        <ellipse cx="30" cy="18" rx="6" ry="12" transform="rotate(135 30 18)"/>
        <circle cx="30" cy="18" r="3.4"/>
      </g>
      <path d="M30,30 C 22,34 22,44 30,50 C 38,44 38,34 30,30 Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
    </symbol>
  </defs>
</svg>

<!-- HERO / SEAL -->
<div id="hero-scene">
    <div class="envelope-card" id="envelope-card">
        <div class="preview-ganesha">॥ श्री गणेशाय नमः ॥</div>
        <div class="preview-names">Aditya &amp; Neha</div>
        <div class="wax-seal" onclick="openEnvelope()">A&amp;N</div>
        <div class="tap-hint">Tap the seal to open</div>
    </div>
</div>

<!-- MAIN CARD -->
<div id="app-container">
    <div class="frame-outer">
        <svg class="corner-ornament corner-tl"><use href="#ornament-corner"/></svg>
        <svg class="corner-ornament corner-tr"><use href="#ornament-corner"/></svg>
        <svg class="corner-ornament corner-bl"><use href="#ornament-corner"/></svg>
        <svg class="corner-ornament corner-br"><use href="#ornament-corner"/></svg>

        <div class="app-inner">
            <svg class="medallion top"><use href="#ornament-medallion"/></svg>

            <div class="ganesha-mark">॥ श्री गणेशाय नमः ॥</div>
            <div class="pre-title" id="ui-tagline"></div>
            <h1 class="couple-name" id="ui-name1"></h1>
            <span class="ampersand">&amp;</span>
            <h1 class="couple-name" id="ui-name2"></h1>

            <div class="divider"></div>

            <div id="auth-section">
                <div class="pre-title" style="margin-bottom: 14px; color: var(--ink-soft);">Your Invitation</div>
                <input type="text" id="inviteCode" placeholder="ENTER YOUR PASSCODE" style="text-transform: uppercase;">
                <button class="btn-primary" onclick="verifyPasscode()">Unlock Details</button>
                <div id="auth-error" style="color: #990000; font-size: 0.82rem; margin-top: 14px; font-weight: 500;"></div>
            </div>

            <div id="events-container" style="display: none;">
                <p style="font-family: 'Cormorant Garamond', serif; font-variant: small-caps; font-size: 1.3rem; color: var(--ink); font-weight: 600; letter-spacing: 1px;" id="welcome-message"></p>
                <p style="font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--ink-soft); margin-bottom: 28px;">Please see the details of our celebration below.</p>

                <div id="dynamic-events"></div>

                <div id="rsvp-footer">
                    <div class="divider"></div>
                    <textarea id="dietary" rows="3" placeholder="Dietary requirements or special notes..."></textarea>
                    <button class="btn-primary" onclick="submitRSVP()" id="submitBtn">Send RSVP</button>
                    <div id="status-msg" style="margin-top: 15px; font-size: 0.9rem; font-weight: 500;"></div>
                </div>
            </div>

            <svg class="medallion bottom"><use href="#ornament-medallion"/></svg>
        </div>
    </div>
</div>

<script>
    const AppData = {
        scriptUrl: "https://script.google.com/macros/s/AKfycbyY0A0_NZGJCfGli4bRGlHGhD1gFzI4FpVwedfzMcrR_ivo_k1eoS5x7jk3U6_mdhgo/exec",
        couple: { name1: "Aditya", name2: "Neha" },
        tagline: "joyfully invite you to celebrate the wedding of",
        events: {
            haldi: { id: "haldi", title: "Haldi & Mehndi", date: "Monday, November 16", time: "4:00 PM", venue: "Family Residence" },
            wedding: { id: "wedding", title: "Wedding Ceremony", date: "Thursday, November 18", time: "10:30 AM", venue: "The Epping Club" },
            reception: { id: "reception", title: "Wedding Reception", date: "Saturday, November 20", time: "6:00 PM", venue: "Fontana Amorosa" }
        },
        guest: null,
        rsvpState: {}
    };

    document.getElementById('ui-tagline').innerText = AppData.tagline;
    document.getElementById('ui-name1').innerText = AppData.couple.name1;
    document.getElementById('ui-name2').innerText = AppData.couple.name2;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('code')) {
        document.getElementById('inviteCode').value = urlParams.get('code');
    }

    // simple, reliable reveal — opacity/transform only, no clip-path 3D flip
    function openEnvelope() {
        const card = document.getElementById('envelope-card');
        const hero = document.getElementById('hero-scene');
        const app = document.getElementById('app-container');

        card.classList.add('breaking');

        setTimeout(() => {
            hero.classList.add('dismissed');
            app.style.display = 'block';
            void app.offsetWidth; // force reflow so the transition actually plays
            app.classList.add('visible');

            if (document.getElementById('inviteCode').value) {
                setTimeout(verifyPasscode, 300);
            }
        }, 450);
    }

    function verifyPasscode() {
        const code = document.getElementById('inviteCode').value.trim();
        const err = document.getElementById('auth-error');
        err.innerText = "";

        if (!code) {
            err.innerText = "Please enter your passcode.";
            return;
        }

        err.style.color = "#666";
        err.innerText = "Locating your invitation...";

        const finalUrl = AppData.scriptUrl + "?code=" + encodeURIComponent(code);

        fetch(finalUrl, { redirect: "follow" })
            .then(response => response.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data.found) {
                        AppData.guest = data;
                        console.log("Guest record:", data); // helpful for checking which flags are set
                        document.getElementById('auth-section').style.display = 'none';
                        document.getElementById('events-container').style.display = 'block';
                        document.getElementById('welcome-message').innerText = `To: ${data.name}`;
                        renderEvents();
                    } else {
                        err.style.color = "#990000";
                        err.innerText = data.error ? ("Error: " + data.error) : "Passcode not recognized.";
                    }
                } catch (e) {
                    err.style.color = "#990000";
                    err.innerText = "Connection error — got a non-JSON response.";
                    console.error("Non-JSON response:", text);
                }
            })
            .catch(err2 => {
                err.style.color = "#990000";
                err.innerText = "Network error. Please try again.";
                console.error("Fetch error:", err2);
            });
    }

    function renderEvents() {
        const container = document.getElementById('dynamic-events');
        const footer = document.getElementById('rsvp-footer');
        container.innerHTML = "";

        const guestPermissions = [
            { allowed: AppData.guest.haldi || AppData.guest.mehndi, data: AppData.events.haldi },
            { allowed: AppData.guest.wedding, data: AppData.events.wedding },
            { allowed: AppData.guest.reception, data: AppData.events.reception }
        ];

        const anyAllowed = guestPermissions.some(e => e.allowed);

        if (!anyAllowed) {
            // Data fallback: this guest's row has no events marked YES in the sheet
            container.innerHTML = `<div class="no-events-note">We don't see any events marked on your invitation yet — if this looks wrong, please reach out to us directly and we'll sort it out.</div>`;
            footer.style.display = 'none';
            return;
        }
        footer.style.display = 'block';

        guestPermissions.forEach(event => {
            if (event.allowed) {
                AppData.rsvpState[event.data.id] = "N/A";

                const eventHTML = `
                    <div class="event-block">
                        <div class="event-title">${event.data.title}</div>
                        <div class="event-details">
                            ${event.data.date} &middot; ${event.data.time}
                            <span class="label">Venue</span>
                            ${event.data.venue}
                        </div>
                        <div class="btn-group">
                            <button class="btn-rsvp" id="btn-yes-${event.data.id}" onclick="setRsvp('${event.data.id}', 'Attending')">Will Attend</button>
                            <button class="btn-rsvp" id="btn-no-${event.data.id}" onclick="setRsvp('${event.data.id}', 'Declined')">Will Not Attend</button>
                        </div>
                    </div>
                `;
                container.innerHTML += eventHTML;
            }
        });
    }

    function setRsvp(eventId, status) {
        AppData.rsvpState[eventId] = status;
        document.getElementById(`btn-yes-${eventId}`).classList.remove('selected');
        document.getElementById(`btn-no-${eventId}`).classList.remove('selected');
        if (status === 'Attending') document.getElementById(`btn-yes-${eventId}`).classList.add('selected');
        if (status === 'Declined') document.getElementById(`btn-no-${eventId}`).classList.add('selected');
    }

    function submitRSVP() {
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('status-msg');

        const invitedEventIds = Object.keys(AppData.rsvpState);
        const missedEvent = invitedEventIds.find(id => AppData.rsvpState[id] === "N/A");

        if (missedEvent) {
            msg.style.color = "#990000";
            msg.innerText = "Please select 'Will Attend' or 'Will Not Attend' for all events.";
            return;
        }

        btn.innerText = "Sending...";
        btn.disabled = true;
        msg.innerText = "";

        const payload = {
            code: AppData.guest.code,
            name: AppData.guest.name,
            haldi: AppData.rsvpState.haldi || "N/A",
            wedding: AppData.rsvpState.wedding || "N/A",
            reception: AppData.rsvpState.reception || "N/A",
            dietary: document.getElementById('dietary').value
        };

        fetch(AppData.scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            msg.style.color = "green";
            msg.innerText = "Thank you! Your RSVP has been recorded.";
            btn.style.display = "none";
        })
        .catch(() => {
            msg.style.color = "#990000";
            msg.innerText = "Error sending RSVP. Please try again.";
            btn.innerText = "Send RSVP";
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
